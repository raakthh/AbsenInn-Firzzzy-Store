<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6C55F2">
  <title>Buat Password Baru · AbsenInn</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-root="">
  <div class="auth" style="grid-template-columns:minmax(0,1fr)">
    <section class="auth-form-wrap">
      <div class="auth-form">
        <div class="brand" style="margin-bottom:28px">
          <img class="brand-mark" src="assets/images/logo-mark.svg" alt="">
          <div><div class="brand-name">Absen<span>Inn</span></div><div class="brand-desc">SMART EMPLOYEE MANAGEMENT</div></div>
        </div>
        <h1>Buat password baru</h1>
        <p class="text-2 mt-2" id="rp-sub">Memverifikasi link reset…</p>
        <div id="rp-alert" class="mt-4"></div>
        <form id="rp-form" class="mt-6 hidden" novalidate>
          <div class="field" data-field="password">
            <label class="label" for="password">Password baru</label>
            <input class="input" id="password" name="password" type="password" autocomplete="new-password" placeholder="Minimal 8 karakter">
            <span class="field-error"></span>
          </div>
          <div class="field mt-4" data-field="confirm">
            <label class="label" for="confirm">Ulangi password baru</label>
            <input class="input" id="confirm" name="confirm" type="password" autocomplete="new-password">
            <span class="field-error"></span>
          </div>
          <button class="btn btn-primary btn-lg btn-block mt-6" type="submit" id="rp-btn"><i data-icon="key-round"></i>Simpan password</button>
        </form>
        <a class="card-link mt-6" href="login.html" style="display:inline-flex"><i data-icon="arrow-left"></i>Kembali ke login</a>
      </div>
    </section>
  </div>
  <script src="js/config.js"></script>
  <script src="js/core/icons.js"></script>
  <script src="js/core/format.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/pages/reset-password.js"></script>
</body>
</html>
