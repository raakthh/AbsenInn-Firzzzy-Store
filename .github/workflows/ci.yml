name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: absen
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/absen
      DJANGO_DEBUG: "True"
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Database security tests (RLS)
        run: |
          psql -h localhost -U postgres -d absen -v ON_ERROR_STOP=1 -f tools/supabase_shim.sql -f database/schema.sql -f database/tests/rls_tests.sql | tail -1
      - name: schema.sql is up to date with migrations
        run: |
          python tools/build_schema.py && git diff --exit-code database/schema.sql
      - name: Django API tests (Phase 3–8)
        working-directory: backend
        run: python manage.py test --verbosity 1
      - name: Deploy checks
        working-directory: backend
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: ci-only-not-secret-0123456789abcdefghijklmnopqrstuvwxyz
          DJANGO_ALLOWED_HOSTS: example.com
        run: python manage.py check --deploy --fail-level WARNING
